# -----------------------------------------------------
# ▄▀█ █▄░█ █ █▀▄▀█ ▄▀█ ▀█▀ █ █▀█ █▄░█
# █▀█ █░▀█ █ █░▀░█ █▀█ ░█░ █ █▄█ █░▀█
#
# name "Improved"
# tuned from default + me-2/diablo presets: snappier open, soft overshoot
# close, real layer (rofi/dunst) animations to match the new blur.
# -----------------------------------------------------

animations {
    enabled = yes

    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, easeOutExpo, popin 90%
    animation = windowsIn, 1, 4, easeOutExpo, popin 90%
    animation = windowsOut, 1, 3.5, md3_accel, popin 90%
    animation = windowsMove, 1, 3.5, easeInOutCirc

    animation = fade, 1, 4, md3_decel
    animation = fadeIn, 1, 3, md3_decel
    animation = fadeOut, 1, 3, md3_accel

    animation = border, 1, 1, liner
    animation = borderangle, 1, 30, liner, once

    animation = workspaces, 1, 4, md3_decel, slide
    animation = specialWorkspace, 1, 3.5, md3_decel, slidevert

    animation = layers, 1, 3, md3_decel, slide
    animation = layersIn, 1, 3, md3_decel, slide
    animation = layersOut, 1, 2, md3_accel, slide
}
