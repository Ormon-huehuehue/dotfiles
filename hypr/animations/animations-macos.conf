# -----------------------------------------------------
# name "macOS"
# Spring-like overshoot beziers + popin zoom open.
# ponytail: Hyprland 0.54 has no spring curves in hyprlang (0.55+ Lua only);
# overshoot beziers approximate mass 1 / stiffness 70 / damping 10. Swap to real springs after upgrade.
# -----------------------------------------------------

animations {
    enabled = true
    bezier = spring, 0.16, 1.04, 0.30, 1.00      # long curvy ease-out, faint overshoot
    bezier = springSoft, 0.22, 1.00, 0.36, 1.00  # easeOutQuint, no bounce
    bezier = macOut, 0.40, 0.00, 0.60, 0.20      # quick accelerate-out
    bezier = macEase, 0.16, 1.00, 0.30, 1.00     # easeOutExpo-ish tail
    bezier = liner, 1, 1, 1, 1

    animation = windowsIn, 1, 4.5, spring, slide
    animation = windowsOut, 1, 2.0, macOut, slide
    animation = windowsMove, 1, 2.5, springSoft, slide
    animation = fade, 1, 3.5, macEase
    animation = fadeOut, 1, 1.8, macOut
    animation = layersIn, 1, 1.5, macEase, popin 90%
    animation = layersOut, 1, 1.8, macOut, popin 90%
    animation = fadeLayersIn, 1, 1.2, macEase
    animation = fadeLayersOut, 1, 1.5, macOut
    animation = workspaces, 1, 3.0, springSoft, slide
    animation = specialWorkspace, 1, 2.5, spring, slidefadevert 15%
    animation = border, 1, 1.6, liner
    animation = borderangle, 1, 82, liner, once
}
