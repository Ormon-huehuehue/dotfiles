# See https://wiki.hyprland.org/Nvidia/

# Forcing all apps onto the dGPU (which has no display attached — eDP-1 is
# wired to the AMD iGPU, card2) kept it from runtime-suspending, which is why
# suspend failed (NVRM: PM suspend notifier failed) whenever a GPU-rendering
# app like Zed was open. Opt in per-app instead: prefix a launch with
# `__NV_PRIME_RENDER_OFFLOAD=1 __GLX_VENDOR_LIBRARY_NAME=nvidia %command%`.
env = __GL_VRR_ALLOWED,1

# WLR_DRM_NO_ATOMIC and no_hardware_cursors were legacy workarounds for
# running Nvidia as the primary/display GPU. AMD (card2) drives the actual
# panel here, so both were just forcing a slower, all-software cursor/modeset
# path for no reason — removed since they directly caused the choppy cursor.
