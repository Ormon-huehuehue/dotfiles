# --- Monitor Configuration ---
# Disable virtual monitor from screenshare/recording
#monitor = grimblastVD, disable

# External monitor catch-all (placed to the right of laptop)
monitor = HDMI-A-1, 2560x1440@100, auto-right , 1, bitdepth, 8



#Home monitor / TV
#monitor = HDMI-A-1, 1920x1080@75, auto-right, 1
#monitor = HDMI-A-1, auto, auto-right, 1

# Laptop screen
monitor = eDP1, 2880x1800@90, 0x0, 1.875



# --- Clamshell Mode Logic ---
# bindl: works even when the screen is locked
# Triggered when the lid is closed: disable internal monitor
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"

# Triggered when the lid is opened: restore config from file
bindl = , switch:off:Lid Switch, exec, hyprctl reload

render {
    cm_auto_hdr = 0

    cm_fs_passthrough = 0
  }
